[project]
name = "prosperity5bt"
description = "Backtester for IMC Prosperity 5 algorithms"
version = "0.0.0"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Jasper van Merle", email = "jaspervmerle@gmail.com"}, {name = "Karl Oddshammar", email = "karloddsh@proton.me"}]
keywords = ["imc", "prosperity", "backtest", "backtester"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">= 3.9"
dependencies = [
    "ipython>=8.18.1",
    "jsonpickle>=4.0.2",
    "orjson>=3.10.15",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
prosperity5bt = "prosperity5bt.__main__:main"

[project.urls]
Repository = "https://github.com/alexoddsh/imc-prosperity-5-backtester"
Issues = "https://github.com/alexoddsh/imc-prosperity-5-backtester/issues"
Changelog = "https://github.com/alexoddsh/imc-prosperity-5-backtester/releases"

[tool.setuptools.packages.find]
include = ["prosperity5bt", "prosperity5bt.*"]

[tool.setuptools.package-data]
prosperity5bt = ["resources/*/*/*.csv"]

[dependency-groups]
dev = [
    "ruff>=0.9.7"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
